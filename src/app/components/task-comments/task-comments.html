<div class="comments-section-container">
  
  <div class="discussion-timeline">
    @if (isLoading()) {
      <div class="loading-state">
        <mat-spinner diameter="24"></mat-spinner>
      </div>
    }

    <div class="comments-scroll-area">
      @for (comment of comments(); track comment.id) {
        <article class="comment-row">
          <div class="comment-avatar">
            <mat-icon>person</mat-icon>
          </div>
          
          <div class="comment-bubble">
            <div class="comment-info">
              <span class="author-name">{{ comment.author_name || 'Team Member' }}</span>
              <span class="time-dot">•</span>
              <span class="timestamp">{{ comment.created_at | date:'HH:mm' }}</span>
            </div>
            <div class="comment-text">
              <p>{{ comment.body }}</p>
            </div>
          </div>
        </article>
      } @empty {
        @if (!isLoading()) {
          <div class="empty-state">No messages yet. Start the discussion!</div>
        }
      }
    </div>
  </div>

  <div class="composer-container">
    <div class="custom-input-wrapper">
      <textarea 
        [(ngModel)]="newCommentBody" 
        [disabled]="isSubmitting()" 
        placeholder="Type your message..."
        class="native-textarea"
        rows="1"
        (input)="adjustHeight($event)">
      </textarea>
      
      <button 
        class="send-icon-btn"
        (click)="onSubmit()" 
        [disabled]="isSubmitting() || !newCommentBody().trim()">
        <mat-icon>{{ isSubmitting() ? 'sync' : 'send' }}</mat-icon>
      </button>
    </div>
  </div>
</div>
