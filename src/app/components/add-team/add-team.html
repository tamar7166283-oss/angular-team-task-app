<div class="modal-overlay" (click)="onClose()">
  <div class="modal-card animate-in" (click)="$event.stopPropagation()">
    
    <header class="modal-header">
      <div class="icon-box">
        <mat-icon>group_add</mat-icon>
      </div>
      <h2>Create New Team</h2>
      <p>Build a new space for your collaborators</p>
      <button mat-icon-button (click)="onClose()" class="close-x">
        <mat-icon>close</mat-icon>
      </button>
    </header>

    <form [formGroup]="teamForm" (ngSubmit)="onSubmit()" class="modal-form">
      
      <div class="field-wrapper">
        <span class="field-label">Team Name</span>
        <mat-form-field appearance="outline" class="pill-field">
          <mat-icon matPrefix>groups</mat-icon>
          <input matInput formControlName="name" placeholder="e.g. Design Elite or Alpha Squad">
          @if (teamForm.get('name')?.invalid && teamForm.get('name')?.touched) {
            <mat-error>Name is required (2-30 characters)</mat-error>
          }
        </mat-form-field>
      </div>

      @if (errorMessage()) {
        <div class="error-banner">
          <mat-icon>report_problem</mat-icon>
          <span>{{ errorMessage() }}</span>
        </div>
      }

      <footer class="modal-actions">
        <button type="button" mat-button (click)="onClose()" class="btn-secondary">
          Cancel
        </button>
        <button type="submit" 
                mat-flat-button 
                class="btn-primary-exec" 
                [disabled]="teamForm.invalid || isLoading()">
          {{ isLoading() ? 'Creating...' : 'Create Team' }}
        </button>
      </footer>
    </form>
  </div>
</div>
